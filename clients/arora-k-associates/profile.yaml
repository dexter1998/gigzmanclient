#
# `reviews` stays false deliberately: ICAI's Code of Ethics prohibits testimonials,
# star ratings and endorsements on a chartered accountant's own website, even when
# genuine. The firm's 5.0 rating and 36 reviews continue to work on the Google
# Business Profile itself. Flip this only if the firm's CA decides otherwise.
