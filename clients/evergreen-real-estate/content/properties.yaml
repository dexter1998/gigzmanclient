    description: "Farmhouse for sale - 45 minutes from gurgaon Location: Intersection of sohna-Rewari road (Nh-919) & western peripheral (Kmp) expressway Strategic investment highlights Connectivity hub: Positioned at a critical multi-Modal intersection. The haryana orbital rail corridor (Horc)a 121.7 km double-Line projectruns adjacent to the property. Proximity to rail stations: The farm is near proposed horc stations at sohna and dhulawat, which will connect directly to the delhi-Rewari line and major logistics hubs. Industrial growth: Located near the imt sohna (1,500+ acres) development, which includes an electronics manufacturing cluster and major anchor units like atl battery technology. Future \"panchgram\" city: The haryana government is developing five new planned cities along the kmp expressway; Suramya falls within this high-Growth \"panchgram\" region. The \"sweet water\" edge: A rare operational borewell with 300 tds sweet water, providing a significant operational advantage in a region known for high salinity previous turns. Nearby heritage & leisure attractions Position suramya as a base for exploring the rich indo-Islamic and natural heritage of the aravallis: Sohna hill fort (17th century): Perched on the aravallis, offering panoramic views and a popular spot for photography and short treks. Shri shiv kund: Famous natural sulfur hot springs and an ancient shiva temple, a key spiritual and wellness destination in sohna. Heritage sites in nuh: Short drive to sheikh musa dargah (Known for its \"shaking minarets\"), chui mal ka talaab, and the historic kotla fort. Damdama lake: A hub for adventure activities like boating, kayaking, and rock climbing, located just 10 km away. Property specs Area: 2,000 square yards (3-Side open land). Built-Up: Minimalist 2 bhk with all modern comforts, ready for immediate use or farm-Stay rental"
