          salary accordingly.

  - slug: business-advisory
    title: Business Advisory
    category: business_corporate
    ca_exclusive: false
    summary: Advisory on structure, financial reporting and regulatory considerations.
    overview: >-
      Advice on business structure, financial reporting requirements and the regulatory
