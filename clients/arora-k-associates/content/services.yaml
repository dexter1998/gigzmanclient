    who_needs_this:
      - Registered persons who have received a notice
      - Businesses with differences flagged in returns
      - Entities subject to departmental verification
    scope_of_assistance:
      - Review of the notice and provision involved
      - Assessment of information and documentation required
      - Preparation and submission of the response
      - Follow-up on the proceeding as required
    documents_required:
      - Copy of the notice received
      - Returns and reconciliations for the period
      - Supporting documentation for the matter raised
    engagement_process:
      - { step: Review, detail: Examining the notice and applicable provision. }
      - { step: Assessment, detail: Identifying the response and documents required. }
      - { step: Response, detail: Preparing and submitting the reply within the period allowed. }
    timelines: Governed by the response period stated in the notice.
    considerations: >-
      Outcomes depend on the facts and the view taken by the authority. No particular
      outcome is assured.
    faqs:
      - question: Can a response period be extended?
        answer: >-
          Extension depends on the provision under which the notice is issued and the
          discretion of the authority.

  # ----------------------------------------------------- Audit and Assurance
  - slug: statutory-audit
    title: Statutory Audit
    category: audit_assurance
    ca_exclusive: true
    summary: Audit of financial statements as required under applicable law.
    overview: >-
      Audit of financial statements in accordance with applicable auditing standards,
      leading to an opinion on whether the statements give a true and fair view.
    who_needs_this:
      - Companies required to have their accounts audited
      - Entities subject to audit under their governing statute
      - Organisations requiring audited statements for regulatory purposes
    scope_of_assistance:
      - Planning based on an understanding of the entity
      - Assessment of internal controls relevant to the audit
      - Examination of records and audit procedures
      - Reporting in accordance with applicable requirements
    documents_required:
      - Books of account and financial statements
      - Supporting records and reconciliations
      - Statutory registers and prior year audit report
    engagement_process:
      - { step: Planning, detail: Understanding the entity and assessing risk areas. }
      - { step: Examination, detail: Performing audit procedures on selected areas. }
      - { step: Reporting, detail: Communicating findings and issuing the report. }
    timelines: Aligned to the reporting requirements applicable to the entity.
    considerations: >-
      An audit is conducted in accordance with applicable standards and is not designed
      to detect every irregularity.
    faqs:
      - question: What does the audit opinion cover?
        answer: >-
          The opinion addresses whether the financial statements give a true and fair
          view in accordance with the applicable framework.

  - slug: internal-audit
    title: Internal Audit
    category: audit_assurance
    ca_exclusive: false
    summary: Review of internal controls, processes and compliance with defined procedures.
    overview: >-
      Examination of internal processes and controls against defined procedures, with
      reporting on observations and recommendations to management.
    who_needs_this:
      - Entities required to conduct internal audit under applicable provisions
      - Organisations seeking independent review of internal processes
      - Businesses strengthening control over specific functions
    scope_of_assistance:
      - Agreement of scope and coverage with management
      - Review of processes and control effectiveness
      - Testing of transactions within the agreed scope
      - Reporting of observations and recommendations
    documents_required:
      - Process documentation and standard operating procedures
      - Transaction records for the review period
      - Prior internal audit reports, where available
    engagement_process:
      - { step: Scoping, detail: Agreeing coverage, periodicity and reporting format. }
      - { step: Review, detail: Examining processes and testing transactions. }
      - { step: Reporting, detail: Reporting observations with recommended action. }
    timelines: Determined by the agreed scope and reporting periodicity.
    considerations: >-
      Coverage is limited to the scope agreed with management and does not constitute
      an opinion on financial statements.
    faqs:
      - question: How is scope determined?
        answer: >-
          Scope is agreed with management based on the areas identified for review and
          any applicable statutory requirement.

  - slug: compliance-review
    title: Compliance Review
    category: audit_assurance
    ca_exclusive: false
    summary: Review of adherence to applicable statutory and regulatory requirements.
    overview: >-
      Assessment of whether applicable filing, registration and record-keeping
      requirements have been complied with, and identification of open items.
    who_needs_this:
      - Businesses reviewing their compliance position
      - Entities preparing for a transaction or regulatory review
      - Organisations consolidating compliance across functions
    scope_of_assistance:
      - Identification of applicable requirements
      - Review of filings made during the period
      - Identification of pending or delayed compliance
      - Reporting with recommended corrective action
    documents_required:
      - Registration certificates and statutory records
      - Filings made during the review period
      - Correspondence with authorities, where relevant
    engagement_process:
      - { step: Mapping, detail: Identifying requirements applicable to the entity. }
      - { step: Review, detail: Examining filings and records against those requirements. }
      - { step: Reporting, detail: Reporting open items with recommended action. }
    timelines: Dependent on the scope and the number of applicable requirements.
    considerations: >-
      Review covers the requirements identified within the agreed scope for the period
      under review.
    faqs:
      - question: Does the review cover all laws applicable to the entity?
        answer: >-
          Coverage is limited to the requirements identified and agreed within scope at
          the outset.

  - slug: financial-statement-review
    title: Financial Statement Review
    category: audit_assurance
    ca_exclusive: true
    summary: Review of financial statements and their presentation under the applicable framework.
    overview: >-
      Review of financial statements for consistency with books of account and
      conformity with presentation and disclosure requirements.
    who_needs_this:
      - Entities preparing statements for submission to lenders or regulators
      - Organisations seeking review prior to finalisation
      - Businesses reviewing presentation and disclosure adequacy
    scope_of_assistance:
      - Review of statements against books of account
      - Assessment of presentation and disclosure requirements
      - Identification of inconsistencies
      - Communication of observations
    documents_required:
      - Draft financial statements
      - Trial balance and supporting schedules
      - Prior period statements
    engagement_process:
      - { step: Review, detail: Comparing statements with underlying records. }
      - { step: Assessment, detail: Checking presentation and disclosure requirements. }
      - { step: Reporting, detail: Communicating observations for correction. }
    timelines: Dependent on the state of records and the complexity of the entity.
    considerations: >-
      A review provides a lower level of assurance than an audit and does not result in
      an audit opinion.
    faqs:
      - question: Is this the same as an audit?
        answer: >-
          No. A review involves more limited procedures and provides a lower level of
          assurance than an audit.

  # ----------------------------------------------------- Business and Corporate
