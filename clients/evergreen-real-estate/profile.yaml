# until the client confirms. No website and no email are published on the
# listing, so `email` and `social_links` remain empty rather than invented.
#
# Loaded into the database by `pnpm seed:client evergreen-real-estate`.
# Run `pnpm check:content evergreen-real-estate` for the placeholder checklist.

