# Compliance calendar.
#
# These follow the standard recurring statutory pattern. Dates are NOT verified
# against departmental notifications for this period and no extension has been
# checked for — `last_verified_at` is deliberately blank on every entry.
#
# Before delivery: verify each date against the CBDT/CBIC source and set
# `last_verified_at`. The site surfaces "last verified" on the calendar page, so
# an unverified entry is visible to the firm rather than hidden.
#
# An extension is recorded in `extended_due_date`; `due_date` always keeps the
# original statutory date so the history stays auditable.

