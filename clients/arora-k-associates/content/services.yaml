# Service catalogue.
#
# All entries are _status: placeholder — the copy is professionally neutral and
# ICAI-appropriate, but service availability must be confirmed with the firm
# before delivery. Deactivate anything the firm does not offer rather than
# deleting it, so it can be switched back on later.
#
# Copy rules applied throughout: no guaranteed outcomes, no turnaround promises
# without qualification, no fees, no comparative or superlative claims.

_status: placeholder

services:
  # ---------------------------------------------------------------- Taxation
  - slug: income-tax-return
    title: Income Tax Return Filing
    category: taxation
    ca_exclusive: false
    summary: Preparation and filing of income tax returns for individuals, businesses and entities.
    overview: >-
      Assistance with preparing and filing income tax returns based on the income
      earned during the relevant previous year. The applicable return form, regime
      and disclosures depend on the taxpayer category and the nature of income.
    who_needs_this:
      - Salaried individuals with one or more employers during the year
      - Individuals with income from house property, capital gains or other sources
      - Proprietors and professionals maintaining books of account
      - Partnership firms, LLPs and companies
    scope_of_assistance:
      - Review of income details and available documentation
      - Determination of the applicable return form
      - Computation of total income and tax liability
      - Comparison of tax under the old and new regimes
      - Filing of the return and assistance with e-verification
    documents_required:
      - PAN and Aadhaar details
      - Form 16 or salary statements, where applicable
      - Annual Information Statement and Form 26AS
      - Bank interest certificates and investment proofs
      - Details of any capital gains transactions
    engagement_process:
      - { step: Requirement review, detail: Understanding the income profile and applicable provisions. }
      - { step: Information collection, detail: Sharing a checklist based on the taxpayer category. }
      - { step: Computation, detail: Preparing the computation and confirming it with you. }
      - { step: Filing, detail: Filing the return and providing the acknowledgement. }
    timelines: >-
      Timelines depend on the completeness of information provided and the statutory
      due date applicable to the taxpayer category.
    considerations: >-
      Selection of tax regime, applicability of audit provisions and disclosure of
      foreign assets are assessed on the facts of each case.
    faqs:
      - question: Which return form applies to me?
        answer: >-
          The form depends on your sources of income, residential status and taxpayer
          category. This is determined after reviewing your details.
      - question: Can a return be revised after filing?
        answer: >-
          A return may be revised within the timelines specified under the Income-tax
          Act, subject to the conditions applicable at the time.

  - slug: tax-planning-advisory
    title: Tax Planning and Advisory
    category: taxation
    ca_exclusive: false
    summary: Advisory on the tax implications of income, investments and business decisions.
    overview: >-
      Review of the tax position and advice on the implications of proposed
      transactions, investment choices and business structuring, within the framework
      of applicable law.
    who_needs_this:
      - Individuals evaluating regime selection and eligible deductions
      - Businesses considering a change in structure or operations
      - Taxpayers planning significant asset transactions
    scope_of_assistance:
      - Review of the existing tax position
      - Analysis of applicable provisions and available options
      - Written advice on implications and compliance requirements
      - Assistance with implementation and related filings
    documents_required:
      - Prior year returns and computations
      - Details of the proposed transaction or decision
      - Relevant agreements or supporting documents
    engagement_process:
      - { step: Discussion, detail: Understanding the objective and the facts involved. }
      - { step: Analysis, detail: Examining applicable provisions and available positions. }
      - { step: Advice, detail: Communicating implications and compliance requirements. }
    timelines: Varies with the complexity of the matter and the documentation available.
    considerations: >-
      Advice is specific to the facts presented and the law in force. Changes in
      facts or law may alter the position.
    faqs:
      - question: Is advice provided in writing?
        answer: Written advice is provided where the matter warrants a documented position.

  - slug: tds-compliance
    title: TDS Compliance
    category: taxation
    ca_exclusive: false
    summary: Assistance with tax deduction at source, quarterly statements and certificates.
    overview: >-
      Support with determining deduction requirements on specified payments, depositing
      the tax deducted, filing quarterly statements and issuing certificates.
    who_needs_this:
      - Businesses making payments covered by TDS provisions
      - Employers deducting tax on salary payments
      - Entities responsible for deduction on contractual or professional payments
    scope_of_assistance:
      - Determination of the applicable section and rate
      - Review of thresholds and PAN availability
      - Preparation and filing of quarterly statements
      - Generation of deduction certificates
      - Assistance with correction statements and default notices
    documents_required:
      - Details of payments made and payee particulars
      - PAN details of deductees
      - Challan details for tax deposited
      - Previous quarterly statements, where applicable
    engagement_process:
      - { step: Payment review, detail: Identifying payments attracting deduction. }
      - { step: Determination, detail: Confirming section, rate and threshold applicability. }
      - { step: Filing, detail: Preparing and filing the quarterly statement. }
      - { step: Certificates, detail: Issuing certificates to deductees. }
    timelines: Aligned to the quarterly statement due dates applicable to the deductor category.
    considerations: >-
      Section applicability depends on the nature of the payment and the status of the
      payee. Non-availability of PAN affects the applicable rate.
    faqs:
      - question: What happens if a statement is filed late?
        answer: >-
          Late filing attracts fees and may attract interest under the applicable
          provisions. The position is assessed on the facts.

  - slug: tax-audit
    title: Tax Audit
    category: taxation
    ca_exclusive: true
    summary: Audit under the applicable provisions of the Income-tax Act where thresholds are met.
    overview: >-
      Conduct of tax audit where the prescribed turnover or receipts thresholds are met,
      including preparation of the audit report in the specified form.
    who_needs_this:
      - Businesses whose turnover exceeds the prescribed threshold
      - Professionals whose gross receipts exceed the prescribed threshold
      - Taxpayers covered by presumptive taxation provisions in specified circumstances
    scope_of_assistance:
      - Assessment of audit applicability
      - Examination of books of account and supporting records
      - Preparation of the audit report and annexures
      - Filing of the report and related coordination
    documents_required:
      - Books of account for the relevant year
      - Financial statements
      - Supporting records for reported particulars
      - Prior year audit report, where applicable
    engagement_process:
      - { step: Applicability, detail: Confirming whether audit provisions apply. }
      - { step: Examination, detail: Reviewing books and supporting records. }
      - { step: Reporting, detail: Preparing and filing the report in the prescribed form. }
    timelines: Aligned to the statutory due date applicable for the assessment year.
    considerations: >-
      Applicability depends on turnover, receipts and the provisions under which income
      is offered to tax.
    faqs:
      - question: How is audit applicability determined?
        answer: >-
          Applicability is assessed against the thresholds and conditions prescribed for
          the relevant previous year.

  - slug: income-tax-notice-assistance
    title: Income Tax Notice Assistance
    category: taxation
    ca_exclusive: false
    summary: Support with reviewing and responding to notices issued under the Income-tax Act.
    overview: >-
      Review of notices and intimations received, assessment of the requirement, and
      assistance with preparing and submitting a response within the specified period.
    who_needs_this:
      - Taxpayers who have received an intimation or notice
      - Taxpayers with mismatches reported against their filed return
      - Taxpayers subject to assessment or verification proceedings
    scope_of_assistance:
      - Review of the notice and the provision under which it is issued
      - Assessment of the information or documentation required
      - Preparation and submission of the response
      - Follow-up on the proceeding as required
    documents_required:
      - Copy of the notice or intimation received
      - Return and computation for the relevant year
      - Supporting documents relevant to the matter raised
    engagement_process:
      - { step: Review, detail: Examining the notice and the applicable provision. }
      - { step: Assessment, detail: Identifying the response required and information needed. }
      - { step: Response, detail: Preparing and submitting the reply within the period allowed. }
    timelines: Governed by the response period stated in the notice.
    considerations: >-
      Outcomes depend on the facts, the documentation available and the view taken by
      the authority. No particular outcome is assured.
    faqs:
      - question: What should be done on receiving a notice?
        answer: >-
          The notice should be reviewed promptly to identify the provision involved and
          the period available for response.

  # -------------------------------------------------------------------- GST
  - slug: gst-registration
    title: GST Registration
    category: gst
    ca_exclusive: false
    summary: Assistance with registration under GST, including assessment of applicability.
    overview: >-
      Assessment of whether registration is required and assistance with the application,
      including determination of the appropriate registration category.
    who_needs_this:
      - Businesses crossing the applicable turnover threshold
      - Persons making inter-state taxable supplies
      - Entities required to register irrespective of turnover
      - Businesses opting for voluntary registration
    scope_of_assistance:
      - Assessment of registration applicability and category
      - Preparation and submission of the application
      - Response to queries raised on the application
      - Guidance on post-registration compliance requirements
    documents_required:
      - PAN and constitution documents of the entity
      - Proof of principal place of business
      - Bank account details
      - Authorised signatory details and photographs
    engagement_process:
      - { step: Applicability, detail: Determining whether and under which category registration applies. }
      - { step: Documentation, detail: Collecting and verifying the required documents. }
      - { step: Application, detail: Filing the application and responding to queries. }
    timelines: >-
      Dependent on processing by the authority and the resolution of any queries raised.
      Registration is not assured.
    considerations: >-
      Registration category, place of business and nature of supply affect the
      application and subsequent compliance obligations.
    faqs:
      - question: Is registration required in every state of operation?
        answer: >-
          Registration is generally required in each state from which taxable supplies
          are made. Applicability is assessed on the facts.

  - slug: gst-return-filing
    title: GST Return Filing
    category: gst
    ca_exclusive: false
    summary: Preparation and filing of periodic GST returns and annual statements.
    overview: >-
      Preparation and filing of the returns applicable to the registration category,
      based on the outward and inward supply data for the period.
    who_needs_this:
      - Registered persons filing monthly or quarterly returns
      - Composition taxpayers filing periodic statements
      - Registered persons required to file annual returns
    scope_of_assistance:
      - Compilation and review of supply data
      - Reconciliation of input tax credit
      - Preparation and filing of periodic returns
      - Assistance with annual return and reconciliation statement
    documents_required:
      - Sales and purchase registers for the period
      - Purchase invoices and credit or debit notes
      - Details of tax paid and credit availed
    engagement_process:
      - { step: Data collection, detail: Obtaining supply data for the period. }
      - { step: Reconciliation, detail: Matching credit and identifying differences. }
      - { step: Filing, detail: Filing the return and confirming the acknowledgement. }
    timelines: Aligned to the due dates applicable to the registration and filing frequency.
    considerations: >-
      Credit availability depends on supplier compliance and the conditions specified
      under the applicable provisions.
    faqs:
      - question: What if a supplier has not reported an invoice?
        answer: >-
          Credit availability is subject to the conditions in force. Unreported invoices
          are identified during reconciliation and followed up with the supplier.

  - slug: gst-advisory
    title: GST Advisory
    category: gst
    ca_exclusive: false
    summary: Advisory on classification, place of supply, credit eligibility and procedure.
    overview: >-
      Advice on GST implications of transactions, including classification, rate
      applicability, place of supply and input tax credit eligibility.
    who_needs_this:
      - Businesses evaluating the treatment of a specific transaction
      - Entities operating across multiple states
      - Businesses reviewing credit eligibility positions
    scope_of_assistance:
      - Analysis of the transaction and applicable provisions
      - Advice on classification and place of supply
      - Review of credit eligibility and documentation requirements
      - Guidance on procedural compliance
    documents_required:
      - Details and documentation of the transaction
      - Relevant agreements
      - Existing positions adopted, where applicable
    engagement_process:
      - { step: Discussion, detail: Understanding the transaction and the question raised. }
      - { step: Analysis, detail: Reviewing applicable provisions and available positions. }
      - { step: Advice, detail: Communicating the position and its basis. }
    timelines: Varies with the complexity of the transaction.
    considerations: >-
      Classification and rate determination depend on the specific facts. Advice does
      not substitute a ruling from the competent authority.
    faqs:
      - question: Is classification confirmed conclusively?
        answer: >-
          A considered position is provided based on the facts and law. Binding
          confirmation requires an advance ruling.

  - slug: gst-reconciliation
    title: GST Reconciliation
    category: gst
    ca_exclusive: false
    summary: Reconciliation of returns, books of account and available input tax credit.
    overview: >-
      Reconciliation between returns filed, books of account and credit reflected in
      the auto-populated statements, with identification of differences.
    who_needs_this:
      - Registered persons preparing annual returns
      - Businesses with differences between books and returns
      - Entities reviewing credit positions before finalising accounts
    scope_of_assistance:
      - Reconciliation of outward supplies with books
      - Reconciliation of credit with auto-populated statements
      - Identification and analysis of differences
      - Recommendations for corrective action
    documents_required:
      - Books of account for the period
      - Returns filed for the period
      - Auto-populated credit statements
    engagement_process:
      - { step: Collection, detail: Obtaining books, returns and statements. }
      - { step: Reconciliation, detail: Matching records and isolating differences. }
      - { step: Reporting, detail: Reporting differences with recommended action. }
    timelines: Dependent on the volume of transactions and the state of records.
    considerations: >-
      Corrective action may be subject to time limits specified under the applicable
      provisions.
    faqs:
      - question: When should reconciliation be carried out?
        answer: >-
          Periodic reconciliation reduces differences accumulating to the annual return
          stage, though the appropriate frequency depends on transaction volume.

  - slug: gst-notice-assistance
    title: GST Notice Assistance
    category: gst
    ca_exclusive: false
    summary: Support with reviewing and responding to notices issued under GST law.
    overview: >-
      Review of notices received under GST provisions and assistance with preparing and
