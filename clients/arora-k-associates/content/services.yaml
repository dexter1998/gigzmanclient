    timelines: Reporting frequency is agreed at the outset, commonly monthly or quarterly.
    considerations: >-
      Accuracy depends on the completeness and timeliness of the documentation provided.
    faqs:
      - question: Can existing books be taken over mid-year?
        answer: >-
          Yes, subject to a review of the existing records and agreement on the opening
          position.

