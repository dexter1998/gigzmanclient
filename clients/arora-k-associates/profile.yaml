# Client seed data — Arora K & Associates
#
# Loaded into the database by `pnpm seed:client arora-k-associates`.
# After seeding, the dashboard becomes the source of truth; re-running the seed
# only fills gaps unless --force is passed.
#
# Every field is classified in the `_status` block at the bottom:
#   verified    — confirmed from the Google Business Profile listing
#   placeholder — example content for the demo, must be confirmed before delivery
#   pending     — unknown; renders nothing
# Run `pnpm check:content arora-k-associates` for the delivery checklist.

